<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Code Agent</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #0f1115; color: #e6e6e6; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 10px 16px; background: #161a22; border-bottom: 1px solid #262c38;
           display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; color: #7aa2f7; }
  header .note { font-size: 12px; color: #8a94a7; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: auto; }
  select, input, button { background: #1b2130; color: #e6e6e6; border: 1px solid #2c3647;
           border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  input#project { width: 240px; }
  button { cursor: pointer; }
  button#send { background: #3b5bdb; border-color: #3b5bdb; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 860px; width: 100%; margin: 0 auto; }
  .msg .role { font-size: 12px; color: #8a94a7; margin-bottom: 4px; }
  .bubble { background: #161a22; border: 1px solid #262c38; border-radius: 10px;
            padding: 12px 14px; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .msg.user .bubble { background: #1a2440; border-color: #26406e; }
  .trace { font-size: 12px; color: #9aa5b8; margin-top: 8px; border-top: 1px dashed #2c3647; padding-top: 8px; }
  .trace .step { margin: 2px 0; }
  .trace .node { color: #7aa2f7; }
  footer { padding: 12px 16px; background: #161a22; border-top: 1px solid #262c38;
           display: flex; gap: 8px; align-items: flex-end; }
  textarea#input { flex: 1; resize: none; height: 48px; background: #1b2130; color: #e6e6e6;
           border: 1px solid #2c3647; border-radius: 8px; padding: 10px; font-size: 14px; font-family: inherit; }
  .tid { font-size: 11px; color: #5b647a; }
  #modal.modal-hidden { display: none; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex;
           align-items: center; justify-content: center; z-index: 10; }
  .modal-box { background: #161a22; border: 1px solid #2c3647; border-radius: 12px;
               padding: 20px; width: 420px; max-width: 90vw; display: flex; flex-direction: column; gap: 12px; }
  .modal-box h2 { margin: 0; font-size: 16px; color: #7aa2f7; }
  .modal-box label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #9aa5b8; }
  .modal-box input, .modal-box select { width: 100%; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  #cfgSave { background: #3b5bdb; border-color: #3b5bdb; }
  .cfg-status { font-size: 12px; color: #8a94a7; background: #11151d; border: 1px solid #262c38;
                border-radius: 6px; padding: 8px; }
  .cfg-msg { font-size: 12px; min-height: 16px; }
  .cfg-msg.ok { color: #4ec9b0; }
  .cfg-msg.err { color: #f7768e; }
</style>
</head>
<body>
<header>
  <h1>Code Agent</h1>
  <span class="note">多语言开发智能体 · 本地 127.0.0.1 · 无鉴权，勿暴露公网</span>
  <div class="controls">
    <select id="mode" title="任务模式">
      <option value="">自动判别</option>
      <option value="analyze">分析 analyze</option>
      <option value="develop">开发 develop</option>
      <option value="review">审查 review</option>
      <option value="chat">对话 chat</option>
    </select>
    <select id="lang" title="语言">
      <option value="">语言:自动</option>
      <option value="python">python</option>
      <option value="sql">sql</option>
      <option value="java">java</option>
    </select>
    <input id="project" placeholder="项目路径(analyze/develop用)" />
    <button id="newSession">新会话</button>
    <button id="settingsBtn" title="配置 API Key">⚙ 设置</button>
  </div>
</header>

<div id="modal" class="modal-hidden">
  <div class="modal-box">
    <h2>模型配置</h2>
    <div id="cfgStatus" class="cfg-status">加载中…</div>
    <label>模型后端
      <select id="cfgProvider">
        <option value="deepseek">deepseek</option>
        <option value="glm">glm</option>
      </select>
    </label>
    <label>API Key
      <input id="cfgKey" type="password" placeholder="粘贴 API Key，留空不修改" />
    </label>
    <div class="modal-actions">
      <button id="cfgSave">保存</button>
      <button id="cfgClose">关闭</button>
    </div>
    <div id="cfgMsg" class="cfg-msg"></div>
  </div>
</div>
<div id="chat"></div>
<footer>
  <textarea id="input" placeholder="输入需求或问题，Enter 发送，Shift+Enter 换行"></textarea>
  <button id="send">发送</button>
</footer>
<span class="tid" id="tid" style="padding:0 16px 6px;"></span>
<script src="/app.js"></script>
</body>
</html>
